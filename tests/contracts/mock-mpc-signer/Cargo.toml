[package]
name = "mock-mpc-signer"
description = "Sandbox stand-in for the NEAR MPC signer (v1.signer 3.18.0): the sign/respond yield-resume interface, Ed25519 domain only"
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/UEddy/Intatto"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.29"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']

# Its own workspace: built only by the sandbox tests, never part of the vault's build.
[workspace]
