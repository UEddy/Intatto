<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- boot.js must stay the first script: it inserts the CSP with this page load's nonce (vite.config.ts). -->
    <script src="./boot.js"></script>
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Intatto: a vault your AI agent can spend from only within rules the contract enforces. Your money stays intact." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- Link previews. Absolute URLs: the site is served from https://intatto.pages.dev/ (Cloudflare Pages). public/og.png comes from scripts/og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Intatto" />
    <meta property="og:title" content="Intatto: the agent can trade. It can't withdraw." />
    <meta property="og:description" content="A NEAR vault your AI agent trades from, within limits the contract enforces. Its agent key is published, and the money is still there." />
    <meta property="og:url" content="https://intatto.pages.dev/" />
    <meta property="og:image" content="https://intatto.pages.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Intatto. Your money stays intact. The agent can trade. It can't withdraw." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Intatto: the agent can trade. It can't withdraw." />
    <meta name="twitter:description" content="A NEAR vault your AI agent trades from, within limits the contract enforces. Its agent key is published, and the money is still there." />
    <meta name="twitter:image" content="https://intatto.pages.dev/og.png" />
    <title>Intatto</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
